[package]
name = "merida-underground"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
topcoat = { version = "0.9.0", features = ["fs", "multipart"] }
native_db = "0.8.1"
native_model = "0.4.20"
serde = { version = "1", features = ["derive"] }
maud = "0.27"
fluent-bundle = "0.16"
unic-langid = "0.9"
clearurls = "0.0.4"
cached = { version = "4.0.0", features = ["async"] }
url = "2.5.8"
serde_json = "1.0.151"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "query"] }
env_logger = "0.11.11"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
form_urlencoded = "1.2"
aws-sdk-s3 = { version = "=1.136.0", default-features = false, features = ["rustls", "rt-tokio"] }
uuid = { version = "1", features = ["v4"] }

# Small binnary
[profile.release]
strip = true
opt-level = 'z'
