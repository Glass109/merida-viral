[package]
name = "merida-viral"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.9.0", features = ["fs"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
maud = "0.27"
fluent-bundle = "0.16"
unic-langid = "0.9"
clearurls = "0.0.4"
url = "2.5.8"
serde_json = "1.0.151"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "query"] }
